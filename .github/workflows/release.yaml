name: Build & Release

on:
  push:
    branches:
      - "main"

permissions:
  contents: write

jobs:
  build-descriptor:
    name: Build Proto Descriptor
    runs-on: ubuntu-latest
    outputs:
      descriptor_version: ${{ github.sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.SA_CREDENTIALS }}

      - name: Install gcloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.PROJECT_ID }}

      - name: Install Protoc
        uses: arduino/setup-protoc@v3

      - name: Generate Descriptor
        run: |
          make descriptor

      # - name: Build Artifact Path 
      #   run: |
      #     echo "ART_PATH=${{ secrets.REGISTRY }}/${{ secrets.PROJECT_ID }}/${{ secrets.ART_REPOSITORY }}/descriptor-${{ github.sha }}.pb" >> "$GITHUB_ENV"

      # - name: Upload Descriptor
      #   run: |
      #     gcloud artifacts generic upload ${{ env.ART_PATH }} --source=gen/artifacts/descriptor.pb
      - name: Upload Descriptor
        run: |
          gcloud artifacts generic upload \
            --repository=${{ secrets.ART_REPOSITORY }} \
            --location=${{ secrets.GCP_REGION }} \
            --package=protos \
            --version=${{ github.sha }} \
            --source=gen/artifacts/descriptor.pb

  trigger-gateway-deploy:
    name: Trigger Gateway Deployment
    needs: build-descriptor
    runs-on: ubuntu-latest
    steps:
      - name: Trigger
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_PAT }}
          repository: ${{ secrets.GATEWAY_REPO }}
          event-type: trigger-deployment
          client-payload: '{"sha": "${{ github.sha }}"}'

  go-release:
    name: Release Go Module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create tags
        run: |
          BASE_VERSION=${{ secrets.BASE_VERSION }}
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "TRACKING_TAG=${BASE_VERSION}-${SHORT_SHA}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TRACKING_TAG }}
          name: "Release ${{ env.TRACKING_TAG }}"
          generate_release_notes: true
